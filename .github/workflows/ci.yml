name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  integration:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install the five libraries at their pinned commits, then quantstack
        run: |
          python -m pip install --upgrade pip
          for p in sp-pricer volsurface backtest-lab microstructure-lab risk-lab; do
            pip install -e "projects/$p"
          done
          pip install -e ".[dev]"
      - run: pytest -q
        env:
          MPLBACKEND: Agg
