[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "quantstack-lab"
version = "0.1.0"
description = "A connected quantitative finance research stack: structured product pricing, volatility surfaces, honest backtesting, market microstructure and risk, linked into end-to-end studies."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
# The five libraries are pre-1.0, so each is capped below its next minor version: a minor release may
# change an API the adapters use. In a clone, CI installs them from projects/ (git submodules) first.
dependencies = [
    "sppricer>=0.2.1,<0.3",
    "volsurface-lab>=0.2.1,<0.3",
    "btlab>=0.4.0,<0.5",
    "lobkit>=0.3.0,<0.4",
    "marketrisk-lab>=0.4.1,<0.5",
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
]

[project.urls]
Repository = "https://github.com/hossainyousuf751/quant-stack"

[project.optional-dependencies]
dev = ["pytest>=7", "matplotlib>=3.7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: long-running integration test, excluded by default"]
addopts = "-m 'not slow'"

[tool.ruff]
line-length = 120
extend-exclude = ["projects", "sp-pricer", "volsurface", "backtest-lab", "microstructure-lab", "risk-lab"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["quantstack"]
known-third-party = ["sppricer", "volsurface", "btlab", "lobkit", "risklab"]
